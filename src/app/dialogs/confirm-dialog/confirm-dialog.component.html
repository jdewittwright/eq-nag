<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content>

  @for (msg of messages; track msg) {
    <p [innerHtml]="msg | coloredString"></p>
  }
  <div class="btn-info">
    @if (data.yesMessage != null) {
      <small>{{data.yesMessage}}</small>
    }
    @if (data.noMessage != null) {
      <small>{{data.noMessage}}</small>
    }
    @if (data.cancelMessage != null) {
      <small>{{data.cancelMessage}}</small>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button [mat-dialog-close]="false" class="t-confirm-no" color="default">{{noText}}</button>
  <button mat-button [mat-dialog-close]="true" class="t-confirm-yes" color="accent">{{yesText}}</button>
  @if (data.cancelMessage != null) {
    <button mat-button [mat-dialog-close]="null" class="t-confirm-yes" color="warn">{{cancelText}}</button>
  }
  @if (data.moreInfo != null) {
    <span style="flex: 1 1 auto;"></span>
    <button mat-button class="color-blue" (click)="data.moreInfo()">More Info</button>
  }

</mat-dialog-actions>
