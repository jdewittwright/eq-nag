<h2 mat-dialog-title>{{(data.title == null ? 'Information required' : data.title)}}</h2>

<mat-dialog-content>

  @for (msg of messages; track msg) {
    <p>{{msg}}</p>
  }

  <mat-form-field>
    @if (data.label != null) {
      <mat-label>{{data.label}}</mat-label>
    }
    <input matInput [(ngModel)]="model" [formControl]="inputControl" [matAutocomplete]="auto" />
    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
      @for (option of filteredOptions | async; track option) {
        <mat-option [value]="option">
          {{option}}
        </mat-option>
      }
    </mat-autocomplete>
    @if (data.hint != null) {
      <mat-hint>{{data.hint}}</mat-hint>
    }
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button [mat-dialog-close]="null" class="t-confirm-no" color="warn">Cancel</button>
  <button mat-button [mat-dialog-close]="model" class="t-confirm-no">OK</button>

</mat-dialog-actions>
