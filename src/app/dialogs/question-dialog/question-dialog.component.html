<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content>

  @for (msg of messages; track msg) {
    <p [innerHtml]="msg | coloredString"></p>
  }
  <div class="btn-info">
    <table>
      @for (q of data.questions; track q) {
        <tr>
          <td><strong>{{q.buttonText}}</strong></td>
          <td>
            @for (msg of q.question; track msg) {
              <div><span [innerHtml]="msg | coloredString"></span></div>
            }
          </td>
        </tr>
      }
      &nbsp;
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions>

  @for (q of data.questions; track q) {
    <button mat-button  (click)="executeAnswer(q)" class="t-confirm-yes {{q.cssClass}}">{{q.buttonText}}</button>
  }
  @if (data.cancellable) {
    <button mat-button mat-dialog-close class="t-confirm-no" color="warn">Cancel</button>
  }

</mat-dialog-actions>
